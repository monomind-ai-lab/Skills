skill: "egm_draft"
description: "Behavioral evaluation scenario suite for egm_draft skill."

scenarios:
  - scenario_id: "polymorphic_intake_concepts_brief"
    description: "Evaluates automatic discovery and ingestion of concepts_brief.md without prompting."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_draft/SKILL.md"
    turns:
      - user_input: "Draft the design document based on our brainstorming session."
        assertions:
          - type: "required_pattern"
            pattern: "(concepts_brief\\.md|intake|predecessor)"
            message: "Drafting should acknowledge concepts_brief.md intake."

  - scenario_id: "section_approval_modal_empty_write_in_guard"
    description: "Asserts modal presentation after each section and chat prompt when write-in is empty."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_draft/SKILL.md"
    turns:
      - user_input: "Draft the Overview & Goals section for our design document."
        assertions:
          - type: "required_pattern"
            pattern: "Approve Overview & Goals and proceed to next section"
            message: "Section approval must present neutral approval option."
          - type: "required_pattern"
            pattern: "Request revisions to Overview & Goals"
            message: "Section approval must present revision request option."
          - type: "forbidden_pattern"
            pattern: "\\(Recommended\\)"
            message: "Section approval must not contain (Recommended) prefix."

  - scenario_id: "directory_finalize_modal_selection"
    description: "Verifies directory probing and single-select directory modal at Step 6."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_draft/SKILL.md"
    turns:
      - user_input: "All sections are approved. Finalize the document and save to the repository."
        assertions:
          - type: "required_pattern"
            pattern: "Save to detected directory"
            message: "Step 6 should present detected directory modal option."

  - scenario_id: "draft_and_write_design_doc"
    description: "Tests complete document generation matching the template structure."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_draft/SKILL.md"
    turns:
      - user_input: "Draft an initial design doc for adding rate limiting to the ingress API."
        assertions:
          - type: "required_pattern"
            pattern: "(Problem Statement|Overview|Goals|Non-Goals|Alternatives Considered)"
            message: "Draft must include standard design document sections."
          - type: "not_contains"
            pattern: "```python"
            message: "Drafting phase must not emit Python implementation code."

  - scenario_id: "artifact_first_delivery"
    description: "Asserts design drafts are written to artifacts rather than dumped in chat."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_draft/SKILL.md"
    turns:
      - user_input: "Generate the design document for telemetry service."
        assertions:
          - type: "contains"
            pattern: "draft"
            message: "Response should acknowledge drafting the design specification."

  - scenario_id: "relative_link_formatting_spec"
    description: "Verifies proper relative link formatting across subdirectories and siblings."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_draft/SKILL.md"
    turns:
      - user_input: "Draft documentation linking child subsystem at ./sub/README.md and sibling at ../sibling/README.md."
        assertions:
          - type: "contains"
            pattern: "./sub/README.md"
            message: "Child link must use relative path formatting."
          - type: "contains"
            pattern: "../sibling/README.md"
            message: "Sibling link must use relative path formatting."
